[tool.poetry]
name = "pySigma-backend-secops"
version = "1.0.0"
description = "pySigma Google SecOps Backend"
authors = ["Stephen Lincoln <stephen@detections.ai>"]
license = "LGPL-3.0-only"
repository = "https://github.com/AttackIQ/pySigma-backend-secops"
packages = [
    { include = "sigma" }
]
include = ["sigma/pipelines/secops/udm_field_schema.json"]

[tool.poetry.dependencies]
python = "^3.10"
pysigma = "^1.0.0"
importlib-resources = "*"

[tool.poetry.group.dev.dependencies]
pytest = "^7.2.1"
pytest-cov = "^4.0.0"
coverage = "^7.2.1"
ruff = "^0.6.9"
beautifulsoup4 = "^4.12.3"
requests = "^2.32.3"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"


[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--cov=sigma --cov-report=term-missing"

[tool.coverage.run]
source = ["sigma"]

[tool.ruff]
# Exclude a variety of commonly ignored directories.
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "venv",
    ".venv"
]

# Same as Black.
line-length = 120

# Assume Python 3.11
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort (import sorting)
    "UP",     # pyupgrade (modernize syntax)
    "B",      # flake8-bugbear (common bugs)
    "C4",     # flake8-comprehensions
    "SIM",    # flake8-simplify
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501", "W291", "W293"]

[tool.ruff.lint.isort]
known-first-party = ["sigma"]